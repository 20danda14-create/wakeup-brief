name: Veri Güncelleme (EGO + Haber)

on:
  schedule:
    - cron: '7,37 * * * *'   # her 30 dk (saat başından kaçınmak için :07 / :37)
  workflow_dispatch:

permissions:
  contents: write            # data.json'u push edebilmek için şart

concurrency:
  group: wakeup-data
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Kodları indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kütüphaneleri yükle
        run: pip install beautifulsoup4

      - name: Veriyi çek
        run: python scraper.py

      - name: Değişiklik varsa kaydet ve yayınla
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Commit edilecek değişiklik yok."
          else
            git commit -m "Otomatik veri güncellendi"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
